<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">DocuDigit AI: evidence before export</title><desc id="desc">Template and scan inputs feed OCR and candidate mapping, followed by explicit field review, approval, and editable Word output with provenance.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#3d5a80"/></marker></defs>
<rect width="720" height="390" rx="14" fill="#f6f8fb"/>
<g font-family="Arial,sans-serif" fill="#1a1a1e"><text x="28" y="32" font-size="12" letter-spacing="2" fill="#3d5a80">LOCAL DOCUMENT PROCESSING / EVIDENCE BEFORE EXPORT</text>
<g fill="white" stroke="#bbc7d5"><rect x="28" y="58" width="204" height="62" rx="8"/><rect x="28" y="142" width="204" height="62" rx="8"/><rect x="278" y="58" width="194" height="62" rx="8"/><rect x="518" y="58" width="174" height="62" rx="8"/></g>
<g font-size="16" font-weight="600"><text x="44" y="84">PDF / PNG / JPEG</text><text x="44" y="168">DOCX + field schema</text><text x="294" y="84">Local OCR</text><text x="534" y="84">Field proposals</text></g>
<g font-size="12" fill="#58677a"><text x="44" y="105">Render &amp; normalise source</text><text x="44" y="189">Validate template contract</text><text x="294" y="105">Tokens + page boxes</text><text x="534" y="105">Rank, retain, or abstain</text></g>
<rect x="278" y="160" width="414" height="88" rx="8" fill="#e6ecf4" stroke="#bbc7d5"/><text x="296" y="186" font-size="17" font-weight="600">Explicit review of every field</text><text x="296" y="210" font-size="14" fill="#3d5a80">Confirmed / Corrected / Missing</text><text x="296" y="231" font-size="12" fill="#58677a">Source boxes + alternatives + warnings</text>
<rect x="278" y="288" width="414" height="74" rx="8" fill="#3d5a80"/><text x="296" y="315" font-size="18" font-weight="600" fill="white">Approve revision → Export</text><text x="296" y="340" font-size="13" fill="#edf2f8">Editable DOCX + provenance JSON</text>
<text x="28" y="307" font-size="14" font-weight="600">Local-first boundary</text><text x="28" y="330" font-size="12" fill="#58677a">No cloud OCR during processing</text><text x="28" y="350" font-size="12" fill="#58677a">Not a browser UI screenshot</text></g>
