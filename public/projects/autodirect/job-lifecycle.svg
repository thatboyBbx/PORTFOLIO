<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">AutoDirect mineral freight lifecycle</title><desc id="desc">Posted to Matched to Accepted to Loading to In transit to Delivered to Closed. Transactional acceptance checks availability before assigning the job. Both parties confirm final closure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#3d5a80"/></marker></defs>
<rect width="720" height="390" rx="14" fill="#f6f8fb"/>
<g font-family="Arial,sans-serif" fill="#1a1a1e"><text x="28" y="32" font-size="12" letter-spacing="2" fill="#3d5a80">MINERAL FREIGHT / ONE SHARED JOB LIFECYCLE</text>
<g fill="white" stroke="#bbc7d5"><rect x="28" y="58" width="194" height="62" rx="8"/><rect x="263" y="58" width="194" height="62" rx="8"/><rect x="498" y="58" width="194" height="62" rx="8"/><rect x="498" y="164" width="194" height="62" rx="8"/><rect x="263" y="164" width="194" height="62" rx="8"/><rect x="28" y="164" width="194" height="62" rx="8"/></g>
<g font-size="17" font-weight="600"><text x="44" y="84">01 Posted</text><text x="279" y="84">02 Matched</text><text x="514" y="84">03 Accepted</text><text x="514" y="190">04 Loading</text><text x="279" y="190">05 In transit</text><text x="44" y="190">06 Delivered</text></g>
<g font-size="12" fill="#58677a"><text x="44" y="105">Shipper describes the load</text><text x="279" y="105">Transporters express interest</text><text x="514" y="105">One transporter assigned</text><text x="514" y="211">Pickup and loading begin</text><text x="279" y="211">Shared status updates</text><text x="44" y="211">Arrival recorded</text></g>
<rect x="28" y="280" width="194" height="80" rx="8" fill="#3d5a80"/><text x="44" y="309" font-size="18" font-weight="600" fill="white">07 Closed</text><text x="44" y="333" font-size="12" fill="#edf2f8">Both parties confirm</text><text x="44" y="350" font-size="12" fill="#edf2f8">Completion record retained</text>
<rect x="263" y="280" width="429" height="80" rx="8" fill="#e6ecf4"/><text x="279" y="306" font-size="16" font-weight="600">Acceptance boundary</text><text x="279" y="330" font-size="13" fill="#3d5a80">Read availability + assign in one transaction</text><text x="279" y="350" font-size="12" fill="#58677a">Already taken → report conflict; do not overwrite</text></g>
<g fill="none" stroke="#3d5a80" stroke-width="1.8" marker-end="url(#arrow)"><path d="M222 89H255"/><path d="M457 89H490"/><path d="M595 120V156"/><path d="M498 195H465"/><path d="M263 195H230"/><path d="M125 226V272"/></g>
</svg>
