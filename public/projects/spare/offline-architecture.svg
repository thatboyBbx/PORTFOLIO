<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
<title id="title">SPARE: offline-first architecture</title><desc id="desc">React and Workbox provide the PWA shell. Dexie keeps a local cache and outbox. Requests pass FastAPI permission, idempotency and version checks before authoritative stock and accounting writes. PostgreSQL and Redis are intended staging dependencies; SQLite supports local tests.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#3d5a80"/></marker></defs>
<rect width="720" height="350" rx="14" fill="#f6f8fb"/>
<g font-family="Arial,sans-serif" fill="#1a1a1e"><text x="28" y="33" font-size="12" letter-spacing="2" fill="#3d5a80">SPARE / LOCAL STATE TO AUTHORITATIVE RECORDS</text>
<g fill="white" stroke="#bbc7d5"><rect x="28" y="64" width="192" height="88" rx="8"/><rect x="28" y="190" width="192" height="106" rx="8"/><rect x="270" y="100" width="202" height="156" rx="8"/><rect x="522" y="64" width="170" height="106" rx="8"/><rect x="522" y="208" width="170" height="88" rx="8"/></g>
<g font-size="17" font-weight="600"><text x="44" y="94">React PWA</text><text x="44" y="220">Dexie / IndexedDB</text><text x="286" y="130">FastAPI</text><text x="538" y="94">PostgreSQL</text><text x="538" y="238">Readiness gate</text></g>
<g font-size="13" fill="#596170"><text x="44" y="120">Workbox app shell</text><text x="44" y="142">Desktop + mobile</text><text x="44" y="245">Local cache + outbox</text><text x="44" y="268">Replay request IDs</text><text x="44" y="287">Provisional local records</text><text x="286" y="157">Role / device identity</text><text x="286" y="181">Idempotency checks</text><text x="286" y="205">Expected versions</text><text x="286" y="229">Approval dispatch</text><text x="538" y="120">Stock + journal ledgers</text><text x="538" y="143">Intended production store</text><text x="538" y="261">DB + Redis + migrations</text><text x="538" y="283">/ready must pass</text></g>
<text x="28" y="329" font-size="12" fill="#596170">Local tests: isolated SQLite. PostgreSQL/Redis staging and real-device UAT remain unverified.</text></g>
